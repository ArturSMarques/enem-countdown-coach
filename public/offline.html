<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem internet — Reta Enem</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { --bg: #f6f3ee; --fg: #1d2a2a; --muted: #5b6767; --primary: #007565; }
      @media (prefers-color-scheme: dark) { :root { --bg: #141b1b; --fg: #e8eeee; --muted: #a3b0b0; --primary: #43bba7; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
      main { max-width: 26rem; text-align: center; }
      img { width: 64px; height: 64px; }
      h1 { font-size: 1.4rem; margin: 16px 0 8px; }
      p { color: var(--muted); margin: 0 0 16px; }
      a, button { display: inline-block; margin: 4px; padding: 10px 16px; border-radius: 12px; font: inherit; font-weight: 700;
        border: 0; cursor: pointer; text-decoration: none; }
      button { background: var(--primary); color: #fff; }
      a { color: var(--primary); }
      :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>Você está sem internet</h1>
      <p>Esta tela ainda não foi aberta neste aparelho com internet, então ela não está guardada. As telas que você já abriu continuam funcionando, e seu progresso está salvo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
      <a href="/">Ir para Hoje</a>
    </main>
  </body>
</html>
